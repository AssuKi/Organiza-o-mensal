<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StonksBank 2027</title>
<style>
  :root {
    --bg-body: #131314;
    --bg-card: #1e1f20;
    --bg-box: #131314;
    --bg-btn: #2c2d2f;
    --bg-btn-hover: #3c4043;
    --border-main: #333537;
    --border-sub: #2c2d2f;
    --border-input: #3c4043;
    --text-main: #e3e3e3;
    --text-title: #ffffff;
    --text-label: #c4c7c5;
    --text-muted: #9aa0a6;
    --c-fixo: #8ab4f8;
    --c-lazer: #fdd663;
    --c-reserva: #c58af9;
    --c-guardado: #81c995;
    --c-sobra: #78d9ec;
    --c-neg: #f28b82;
  }

  body.light-mode {
    --bg-body: #f0f4f9;
    --bg-card: #ffffff;
    --bg-box: #f8fafd;
    --bg-btn: #e8eaed;
    --bg-btn-hover: #dadce0;
    --border-main: #dadce0;
    --border-sub: #e0e3e7;
    --border-input: #bdc1c6;
    --text-main: #1f1f1f;
    --text-title: #1f1f1f;
    --text-label: #3c4043;
    --text-muted: #5f6368;
    --c-fixo: #1a73e8;
    --c-lazer: #d97706;
    --c-reserva: #8430ce;
    --c-guardado: #188038;
    --c-sobra: #007b83;
    --c-neg: #d93025;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s;
  }

  body {
    background: var(--bg-body);
    color: var(--text-main);
    margin: 0;
    padding: 14px;
  }

  /* TELA DE LOGIN */
  .login-wrapper {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: var(--bg-card);
    border: 1px solid var(--border-main);
    border-radius: 18px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-title);
    margin: 0 0 6px 0;
  }

  .login-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .login-input {
    width: 100%;
    background: var(--bg-box);
    border: 1px solid var(--border-input);
    color: var(--text-title);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
  }

  .login-input:focus {
    border-color: var(--c-guardado);
  }

  .login-btn {
    width: 100%;
    background: var(--c-guardado);
    color: #131314;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }

  .login-error {
    color: var(--c-neg);
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* PAINEL PRINCIPAL */
  .card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 18px;
    max-width: 840px;
    margin: 0 auto;
    border: 1px solid var(--border-main);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .brand-tag {
    font-weight: 800;
    font-size: 16px;
    color: var(--c-guardado);
    letter-spacing: -0.3px;
  }

  .month-select {
    background: var(--bg-btn);
    color: var(--text-title);
    border: 1px solid var(--border-input);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }

  .sync-badge {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--bg-box);
    border: 1px solid var(--border-sub);
    color: var(--text-muted);
  }

  .actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--bg-btn);
    color: var(--text-main);
    border: 1px solid var(--border-input);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
  }

  .btn:hover {
    background: var(--bg-btn-hover);
  }

  .btn-accent {
    background: rgba(129, 201, 149, 0.15);
    border-color: var(--c-guardado);
    color: var(--c-guardado);
    font-weight: 600;
  }

  .btn-danger {
    color: var(--c-neg);
    border-color: transparent;
    background: transparent;
    padding: 4px 8px;
    font-size: 14px;
    font-weight: 700;
  }

  .btn-danger:hover {
    background: rgba(242, 139, 130, 0.15);
  }

  /* KPIS DINÂMICOS */
  .top-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .kpi {
    background: var(--bg-box);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid var(--border-sub);
  }

  .kpi-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kpi-val {
    font-size: 17px;
    font-weight: 700;
  }

  .kpi-pct {
    font-size: 11px;
    margin-top: 3px;
    opacity: 0.9;
    font-weight: 500;
  }

  .income-box {
    background: var(--bg-box);
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--border-sub);
  }

  .income-box label {
    font-size: 13px;
    color: var(--text-label);
    font-weight: 500;
  }

  .income-input {
    background: transparent;
    border: none;
    color: var(--text-title);
    font-size: 18px;
    font-weight: 700;
    text-align: right;
    width: 115px;
    outline: none;
  }

  .bar {
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    background: var(--border-sub);
    margin-bottom: 18px;
  }

  .seg {
    height: 100%;
    transition: width 0.2s;
  }

  .section {
    margin-bottom: 14px;
    background: var(--bg-box);
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border-sub);
  }

  .sec-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .sec-title-area {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .sec-title-area:hover {
    text-decoration: underline;
  }

  .sec-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 110px 75px 28px;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }

  .row:last-child {
    margin-bottom: 0;
  }

  .item-label {
    font-size: 13px;
    color: var(--text-label);
    cursor: pointer;
    word-break: break-word;
  }

  .item-label:hover {
    color: var(--text-title);
    text-decoration: underline;
  }

  input[type=range] {
    width: 100%;
    cursor: pointer;
  }

  .num-input {
    background: var(--bg-card);
    border: 1px solid var(--border-input);
    color: var(--text-title);
    border-radius: 6px;
    padding: 5px 6px;
    text-align: right;
    font-size: 13px;
    width: 100%;
    font-weight: 500;
  }

  /* RESPONSIVIDADE CELULAR (iPhone 15) */
  @media (max-width: 620px) {
    body { padding: 10px; }
    .card { padding: 14px; }
    .row {
      grid-template-columns: 1fr 78px 28px;
      grid-template-rows: auto auto;
      background: var(--bg-card);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-sub);
    }
    .item-label {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      font-weight: 500;
    }
    .num-input {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
    }
    .row .btn-danger {
      grid-column: 3 / 4;
      grid-row: 1 / 2;
    }
    .row input[type=range] {
      grid-column: 1 / 4;
      grid-row: 2 / 3;
      margin-top: 4px;
    }
  }

  .note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 12px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" class="login-wrapper">
  <div class="login-card">
    <div style="font-size: 36px; margin-bottom: 8px;">📈</div>
    <h1 class="login-title">StonksBank</h1>
    <div class="login-sub">Acesso restrito ao controle financeiro</div>
    <form onsubmit="handleLogin(event)">
      <input type="text" id="login-user" class="login-input" placeholder="Usuário" autocomplete="username" required>
      <input type="password" id="login-pass" class="login-input" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit" class="login-btn">Entrar</button>
    </form>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- PAINEL FINANCEIRO -->
<div id="app-screen" class="card" style="display:none;">
  <div class="header-row">
    <div class="title-group">
      <span class="brand-tag">StonksBank</span>
      <select id="month-select" class="month-select" onchange="changeMonth()">
        <option value="2027-01">Janeiro 2027</option>
        <option value="2027-02">Fevereiro 2027</option>
        <option value="2027-03">Março 2027</option>
        <option value="2027-04">Abril 2027</option>
        <option value="2027-05">Maio 2027</option>
        <option value="2027-06">Junho 2027</option>
        <option value="2027-07">Julho 2027</option>
        <option value="2027-08">Agosto 2027</option>
        <option value="2027-09">Setembro 2027</option>
        <option value="2027-10">Outubro 2027</option>
        <option value="2027-11">Novembro 2027</option>
        <option value="2027-12">Dezembro 2027</option>
      </select>
      <span class="sync-badge" id="sync-status">⏳ Carregando...</span>
    </div>
    <div class="actions">
      <button class="btn btn-accent" onclick="addTopic()">+ Novo Tópico</button>
      <button class="btn" id="theme-btn" onclick="toggleTheme()">☀️ Claro</button>
      <button class="btn" onclick="resetDefaults()">Restaurar</button>
      <button class="btn" onclick="logout()" title="Bloquear tela">🔒 Sair</button>
    </div>
  </div>

  <div class="top-grid" id="kpi-container"></div>
  <div class="bar" id="bar-container"></div>

  <div class="income-box">
    <label>Salário líquido mensal (R$)</label>
    <input type="number" id="income" class="income-input" value="1650" step="10" oninput="onIncomeChange()">
  </div>

  <div id="topics-container"></div>

  <div class="note">💡 <strong>Dica:</strong> Toque no nome de qualquer tópico ou gasto para <strong>editar</strong> o nome, clique no <strong>×</strong> para <strong>excluir</strong>, ou use <strong>+ Item</strong> / <strong>+ Novo Tópico</strong> para adicionar mais categorias.</div>
</div>

<script>
  // ================= CONFIGURAÇÃO DE LOGIN E NUVEM =================
  const AUTH_USER = 'ricardo';
  const AUTH_PASS = '2027';

  const BIN_ID = '6b002f89ffd5d16053d0ed5b';
  const API_KEY = '$2a$10$AR3I3zDpxSH2Cp9igqh4sO7XrBtKrzKsTKNepTEaTxlYl3SUvLYhi';
  // ===================================================================

  const PALETTE = ['#8ab4f8', '#fdd663', '#c58af9', '#81c995', '#ff8bcb', '#f28b82', '#78d9ec', '#fcad70'];

  const DEFAULT_TOPICS = [
    {
      id: 'fixo',
      name: '1. Fixo (Cartão + Pix)',
      shortName: 'Fixo',
      color: '#8ab4f8',
      items: [
        { id: 'wifi', label: 'Wi-Fi residencial (cartão)', val: 100, max: 300, step: 5 },
        { id: 'celular', label: 'Internet celular (cartão)', val: 64, max: 200, step: 1 },
        { id: 'seguro', label: 'Seguro iPhone (cartão)', val: 45, max: 200, step: 5 },
        { id: 'crunchyroll', label: 'Crunchyroll (Pix)', val: 10, max: 50, step: 1 },
        { id: 'spotify', label: 'Spotify (R$ 41 ÷ 6 pessoas)', val: 7, max: 50, step: 1 }
      ]
    },
    {
      id: 'lazer',
      name: '2. Lazer e Dia a Dia',
      shortName: 'Lazer',
      color: '#fdd663',
      items: [
        { id: 'lazer', label: 'Lazer, saídas, jogos e lanches', val: 300, max: 1000, step: 25 },
        { id: 'diadia', label: 'Dia a dia, transporte e compras', val: 150, max: 600, step: 10 }
      ]
    },
    {
      id: 'reserva',
      name: '3. Reserva de Emergência',
      shortName: 'Reserva',
      color: '#c58af9',
      items: [
        { id: 'reserva', label: 'Aporte mensal Reserva de Emergência', val: 450, max: 1200, step: 25 }
      ]
    },
    {
      id: 'guardado',
      name: '4. Dinheiro Guardado',
      shortName: 'Guardado',
      color: '#81c995',
      items: [
        { id: 'guardado', label: 'Aporte mensal Dinheiro Guardado', val: 400, max: 1200, step: 25 }
      ]
    }
  ];

  let allMonthsData = {};
  let currentIncome = 1650;
  let currentTopics = JSON.parse(JSON.stringify(DEFAULT_TOPICS));
  let saveTimeout = null;

  // --- AUTENTICAÇÃO ---
  function checkAuth() {
    if (localStorage.getItem('stonks_auth') === 'ok') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      loadFromCloud();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app-screen').style.display = 'none';
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('login-user').value.trim().toLowerCase();
    const p = document.getElementById('login-pass').value;
    if (u === AUTH_USER.toLowerCase() && p === AUTH_PASS) {
      localStorage.setItem('stonks_auth', 'ok');
      document.getElementById('login-error').textContent = '';
      checkAuth();
    } else {
      document.getElementById('login-error').textContent = 'Usuário ou senha incorretos.';
    }
  }

  function logout() {
    localStorage.removeItem('stonks_auth');
    checkAuth();
  }

  // --- TEMA ---
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    document.getElementById('theme-btn').textContent = isLight ? '🌙 Escuro' : '☀️ Claro';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  }

  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('theme-btn').textContent = '🌙 Escuro';
  }

  // --- DADOS E COMPATIBILIDADE ---
  function getCurrentMonth() {
    return document.getElementById('month-select').value;
  }

  function hydrateMonthData(raw) {
    if (!raw) {
      currentIncome = 1650;
      currentTopics = JSON.parse(JSON.stringify(DEFAULT_TOPICS));
      return;
    }
    if (Array.isArray(raw.topics)) {
      currentIncome = raw.income !== undefined ? raw.income : 1650;
      currentTopics = JSON.parse(JSON.stringify(raw.topics));
      return;
    }
    // Converte formato antigo automaticamente se existir na nuvem
    currentIncome = raw.income !== undefined ? raw.income : 1650;
    const cloned = JSON.parse(JSON.stringify(DEFAULT_TOPICS));
    cloned.forEach(t => {
      t.items.forEach(it => {
        if (raw[it.id] !== undefined) it.val = raw[it.id];
      });
    });
    currentTopics = cloned;
  }

  // --- RENDERIZAÇÃO DINÂMICA ---
  function renderTopics() {
    const container = document.getElementById('topics-container');
    container.innerHTML = '';

    currentTopics.forEach((topic, tIdx) => {
      const sec = document.createElement('div');
      sec.className = 'section';

      const totalTopic = topic.items.reduce((acc, it) => acc + (parseFloat(it.val) || 0), 0);

      sec.innerHTML = `
        <div class="sec-header">
          <div class="sec-title-area" style="color:${topic.color}" onclick="editTopic(${tIdx})" title="Clique para renomear tópico">
            <span>${escapeHtml(topic.name)}</span>
            <span style="font-size:11px; opacity:0.7;">✎</span>
          </div>
          <div class="sec-controls">
            <span id="sub-topic-${tIdx}" style="color:${topic.color}; font-weight:700;">R$ ${totalTopic.toFixed(0)}</span>
            <button class="btn" onclick="addItem(${tIdx})">+ Item</button>
            <button class="btn btn-danger" onclick="deleteTopic(${tIdx})" title="Excluir tópico">×</button>
          </div>
        </div>
      `;

      topic.items.forEach((item, iIdx) => {
        const maxVal = Math.max(item.max || 500, item.val || 0);
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <span class="item-label" onclick="editItem(${tIdx}, ${iIdx})" title="Clique para editar nome">${escapeHtml(item.label)}</span>
          <input type="range" style="accent-color:${topic.color}" min="0" max="${maxVal}" step="${item.step || 5}" value="${item.val}" oninput="onSliderChange(${tIdx}, ${iIdx}, this)">
          <input type="number" class="num-input" value="${item.val}" oninput="onNumberChange(${tIdx}, ${iIdx}, this)">
          <button class="btn btn-danger" onclick="deleteItem(${tIdx}, ${iIdx})" title="Excluir item">×</button>
        `;
        sec.appendChild(row);
      });

      container.appendChild(sec);
    });

    updateSummary();
  }

  function updateSummary() {
    const inc = parseFloat(document.getElementById('income').value) || 0;
    currentIncome = inc;

    const kpiContainer = document.getElementById('kpi-container');
    const barContainer = document.getElementById('bar-container');
    kpiContainer.innerHTML = '';
    barContainer.innerHTML = '';

    let totalGasto = 0;

    currentTopics.forEach((topic, tIdx) => {
      const sum = topic.items.reduce((acc, it) => acc + (parseFloat(it.val) || 0), 0);
      totalGasto += sum;
      const pct = inc > 0 ? Math.round((sum / inc) * 100) : 0;

      const subEl = document.getElementById(`sub-topic-${tIdx}`);
      if (subEl) subEl.textContent = 'R$ ' + sum.toFixed(0);

      kpiContainer.innerHTML += `
        <div class="kpi">
          <div class="kpi-label">${escapeHtml(topic.shortName || topic.name)}</div>
          <div class="kpi-val" style="color:${topic.color}">R$ ${sum.toFixed(0)}</div>
          <div class="kpi-pct" style="color:${topic.color}">${pct}%</div>
        </div>
      `;

      barContainer.innerHTML += `
        <div class="seg" style="background:${topic.color}; width:${Math.min(100, pct)}%"></div>
      `;
    });

    const sobra = inc - totalGasto;
    const pctSobra = inc > 0 ? Math.round((sobra / inc) * 100) : 0;
    const sobraColor = sobra < 0 ? 'var(--c-neg)' : 'var(--c-sobra)';

    kpiContainer.innerHTML += `
      <div class="kpi">
        <div class="kpi-label">Sobra Livre</div>
        <div class="kpi-val" style="color:${sobraColor}">R$ ${sobra.toFixed(0)}</div>
        <div class="kpi-pct" style="color:${sobraColor}">${pctSobra}%</div>
      </div>
    `;

    barContainer.innerHTML += `
      <div class="seg" style="background:${sobraColor}; width:${Math.max(0, Math.min(100, pctSobra))}%"></div>
    `;
  }

  // --- INTERAÇÕES E CRUD ---
  function onIncomeChange() {
    updateSummary();
    scheduleSave();
  }

  function onSliderChange(tIdx, iIdx, el) {
    const val = parseFloat(el.value) || 0;
    currentTopics[tIdx].items[iIdx].val = val;
    el.nextElementSibling.value = val;
    updateSummary();
    scheduleSave();
  }

  function onNumberChange(tIdx, iIdx, el) {
    const val = parseFloat(el.value) || 0;
    currentTopics[tIdx].items[iIdx].val = val;
    const slider = el.previousElementSibling;
    if (val > parseFloat(slider.max)) slider.max = val;
    slider.value = val;
    updateSummary();
    scheduleSave();
  }

  function addTopic() {
    const name = prompt('Nome do novo tópico (ex: 5. Investimentos ou Cartão Nubank):');
    if (!name || !name.trim()) return;
    const cleanName = name.trim();
    const shortName = cleanName.replace(/^\d+\.\s*/, '').split('(')[0].trim().slice(0, 14);
    const color = PALETTE[currentTopics.length % PALETTE.length];

    currentTopics.push({
      id: 'top_' + Date.now(),
      name: cleanName,
      shortName: shortName || cleanName,
      color: color,
      items: [
        { id: 'it_' + Date.now(), label: 'Novo gasto', val: 0, max: 1000, step: 10 }
      ]
    });
    renderTopics();
    scheduleSave();
  }

  function editTopic(tIdx) {
    const current = currentTopics[tIdx].name;
    const updated = prompt('Editar nome do tópico:', current);
    if (!updated || !updated.trim()) return;
    const cleanName = updated.trim();
    currentTopics[tIdx].name = cleanName;
    currentTopics[tIdx].shortName = cleanName.replace(/^\d+\.\s*/, '').split('(')[0].trim().slice(0, 14);
    renderTopics();
    scheduleSave();
  }

  function deleteTopic(tIdx) {
    if (!confirm(`Excluir o tópico "${currentTopics[tIdx].name}" e todos os seus itens?`)) return;
    currentTopics.splice(tIdx, 1);
    renderTopics();
    scheduleSave();
  }

  function addItem(tIdx) {
    const label = prompt('Nome do novo item/gasto:');
    if (!label || !label.trim()) return;
    const maxInput = prompt('Valor máximo da barra deslizante (ex: 500, 1000, 2000):', '1000');
    const maxVal = parseFloat(maxInput) || 1000;

    currentTopics[tIdx].items.push({
      id: 'it_' + Date.now(),
      label: label.trim(),
      val: 0,
      max: maxVal,
      step: maxVal <= 100 ? 1 : (maxVal <= 500 ? 5 : 10)
    });
    renderTopics();
    scheduleSave();
  }

  function editItem(tIdx, iIdx) {
    const current = currentTopics[tIdx].items[iIdx].label;
    const updated = prompt('Editar nome do item:', current);
    if (!updated || !updated.trim()) return;
    currentTopics[tIdx].items[iIdx].label = updated.trim();
    renderTopics();
    scheduleSave();
  }

  function deleteItem(tIdx, iIdx) {
    if (!confirm(`Excluir "${currentTopics[tIdx].items[iIdx].label}"?`)) return;
    currentTopics[tIdx].items.splice(iIdx, 1);
    renderTopics();
    scheduleSave();
  }

  function changeMonth() {
    hydrateMonthData(allMonthsData[getCurrentMonth()]);
    document.getElementById('income').value = currentIncome;
    renderTopics();
  }

  function resetDefaults() {
    if (!confirm('Restaurar este mês para os tópicos e valores padrão?')) return;
    hydrateMonthData(null);
    document.getElementById('income').value = currentIncome;
    renderTopics();
    scheduleSave();
  }

  // --- SINCRONIZAÇÃO NUVEM ---
  function setStatus(text) {
    document.getElementById('sync-status').textContent = text;
  }

  async function loadFromCloud(silent = false) {
    if (!silent) setStatus('🔄 Sincronizando...');
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (!res.ok) throw new Error();
      const json = await res.json();
      allMonthsData = json.record || {};
      hydrateMonthData(allMonthsData[getCurrentMonth()]);
      document.getElementById('income').value = currentIncome;
      renderTopics();
      setStatus('☁️ Sincronizado');
    } catch (e) {
      setStatus('⚠️ Erro de conexão');
    }
  }

  function scheduleSave() {
    allMonthsData[getCurrentMonth()] = {
      income: currentIncome,
      topics: currentTopics
    };

    setStatus('⏳ Salvando...');
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(allMonthsData)
        });
        if (!res.ok) throw new Error();
        saveTimeout = null;
        setStatus('☁️ Salvo na nuvem');
      } catch (e) {
        saveTimeout = null;
        setStatus('⚠️ Erro ao salvar');
      }
    }, 600);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  checkAuth();

  setInterval(() => {
    if (localStorage.getItem('stonks_auth') === 'ok' && !saveTimeout) {
      loadFromCloud(true);
    }
  }, 6000);
</script>
</body>
</html>
